<!DOCTYPE html>
<html>
<head>
    <title>{{ product[1] }}</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Segoe UI,sans-serif;
    }

    body{
        background:#f5f5f5;
    }

    .navbar{
        background:#111;
        color:white;
        padding:20px 50px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .navbar a{
        color:white;
        text-decoration:none;
    }

    .container{
        width:90%;
        margin:50px auto;
        display:flex;
        gap:50px;
        background:white;
        padding:40px;
        border-radius:15px;
        box-shadow:0 5px 20px rgba(0,0,0,.1);
    }

    .product-image{
        flex:1;
    }

    .product-image img{
        width:100%;
        max-width:500px;
        border-radius:15px;
    }

    .product-info{
        flex:1;
    }

    .product-info h1{
        font-size:42px;
        margin-bottom:20px;
    }

    .price{
        font-size:35px;
        color:#ff6b00;
        font-weight:bold;
        margin-bottom:20px;
    }

    .description{
        color:#555;
        line-height:1.8;
        margin-bottom:30px;
    }

    .btn{
        background:#ff6b00;
        color:white;
        border:none;
        padding:15px 30px;
        font-size:18px;
        border-radius:8px;
        cursor:pointer;
    }

    .btn:hover{
        opacity:.9;
    }

    .size-btn{
    padding:10px 18px;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
    border-radius:8px;
    font-weight:bold;
}

.size-btn:hover{
    border:2px solid #ff6b00;
}

.buy-btn{
    background:#111;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

.related-products{
    width:90%;
    margin:50px auto;
}

.related-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.related-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    padding:15px;
}

.related-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.related-card h3{
    margin-top:10px;
}

    </style>
</head>

<body>

<div class="navbar">

    <h2>EVERWEAR</h2>

    <a href="/">← Back To Shopping</a>

</div>

<div class="container">

    <div class="product-image">

        <img src="{{ product[3] }}">

    </div>

    <div class="product-info">

    <h1>{{ product[1] }}</h1>

    <div style="font-size:24px;margin-bottom:15px;">
        ⭐⭐⭐⭐⭐
        <span style="font-size:16px;color:gray;">
            (4.8/5 · 125 Reviews)
        </span>
    </div>

    <p class="price">
        ₹{{ product[2] }}
    </p>

    <p style="
        color:green;
        font-weight:bold;
        margin-bottom:20px;
        font-size:18px;
    ">
        ✔ In Stock
    </p>

    <h3>Select Size</h3>

    <div style="
        display:flex;
        gap:10px;
        margin:15px 0 25px;
    ">

        <button class="size-btn">S</button>
        <button class="size-btn">M</button>
        <button class="size-btn">L</button>
        <button class="size-btn">XL</button>

    </div>

    <p class="description">
        {{ product[4] }}
    </p>

    <div style="
        display:flex;
        gap:15px;
        margin-top:25px;
    ">

        <a href="/add_to_cart/{{ product[0] }}">
            <button class="btn">
                Add To Cart
            </button>
        </a>

        <button class="buy-btn">
            Buy Now
        </button>

    </div>

</div>

</div>
<section style="
    width:90%;
    margin:50px auto;
">

    <section class="related-products">

    <h2>Related Products</h2>

    <div class="related-grid">

        <div class="related-card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
            <h3>Classic Tee</h3>
        </div>

        <div class="related-card">
            <img src="https://images.unsplash.com/photo-1542272604-787c3835535d">
            <h3>Blue Jeans</h3>
        </div>

        <div class="related-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <h3>Sneakers</h3>
        </div>

    </div>

</section>

</body>
</html>
