<!DOCTYPE html>
<html>
<head>
<title>EVERWEAR Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.navbar{
    background:#111;
    color:white;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
}

.container{
    width:90%;
    margin:30px auto;
}

.cart-title{
    margin-bottom:20px;
}

.cart-item{
    background:white;
    display:flex;
    align-items:center;
    gap:30px;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.cart-item img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}

.price{
    color:#ff6b00;
    font-size:22px;
    font-weight:bold;
}

.checkout{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.btn{
    background:#ff6b00;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
}

.remove-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
    <h2>EVERWEAR</h2>
    <a href="/" style="color:white;text-decoration:none;">
        Continue Shopping
    </a>
</div>

<div class="container">

<h1 class="cart-title">Shopping Cart</h1>


{% for item in cart_items %}

<div class="cart-item">

    <img src="{{ item.image }}">

    <div>

        <h2>{{ item.name }}</h2>

        <p>{{ item.description }}</p>

        <p class="price">₹{{ item.price }}</p>

        <!-- Quantity Controls -->

        <div style="display:flex;gap:10px;align-items:center;">

            <a href="/decrease/{{ item.id }}">
                <button>-</button>
            </a>

            <strong>{{ item.qty }}</strong>

            <a href="/increase/{{ item.id }}">
                <button>+</button>
            </a>

        </div>

        <br>

        <p>
            Subtotal: ₹{{ item.subtotal }}
        </p>

        <a href="/remove/{{ item.id }}">
    <button class="remove-btn">
        Remove
    </button>
</a>

    </div>

</div>

<hr>

{% endfor %}

<div class="checkout">

<h2>Total: ₹{{ total }}</h2>

<button class="btn">
Proceed To Checkout
</button>

</div>

</div>

</body>
</html>
