<!DOCTYPE html>
<html>
<head>
<title>Login - EVERWEAR</title>

<style>
body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Segoe UI;
}

.card{
    background:white;
    padding:40px;
    width:400px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:#ff6b00;
    color:white;
    border:none;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

<h1>Login</h1>

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>
Login
</button>

</form>

</div>

</body>
</html>
