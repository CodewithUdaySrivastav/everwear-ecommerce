<!DOCTYPE html>
<html>
<head>
<title>Manage Products</title>

<style>

body{
    background:#f5f5f5;
    font-family:Segoe UI;
    padding:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:15px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

.btn{
    padding:8px 15px;
    text-decoration:none;
    color:white;
    border-radius:5px;
}

.edit{
    background:#007bff;
}

.delete{
    background:red;
}

</style>

</head>

<body>

<div class="card">

<h1>Manage Products</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
    <th>Action</th>
</tr>

{% for product in products %}

<tr>

    <td>{{ product[0] }}</td>

    <td>{{ product[1] }}</td>

    <td>₹{{ product[2] }}</td>

    <td>

        <a
        class="btn edit"
        href="/admin/edit-product/{{ product[0] }}">
        Edit
        </a>

        <a
        class="btn delete"
        href="/admin/delete-product/{{ product[0] }}">
        Delete
        </a>

    </td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
