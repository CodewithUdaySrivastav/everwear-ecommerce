<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>

    <style>

    body{
        font-family:Segoe UI;
        background:#f5f5f5;
        padding:40px;
    }

    .card{
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 5px 20px rgba(0,0,0,.1);
    }

    .btn{
        display:inline-block;
        background:#ff6b00;
        color:white;
        padding:12px 20px;
        text-decoration:none;
        border-radius:8px;
        margin-top:15px;
    }

    .stats{
    display:flex;
    gap:20px;
    margin:30px 0;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:15px;
    min-width:180px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.stat-card h2{
    font-size:40px;
    color:#ff6b00;
}

    </style>

</head>

<body>

<div class="card">

    <h1>EVERWEAR Admin Dashboard</h1>

    <p>
        Welcome {{ session['user_name'] }}
    </p>
    <div class="stats">

    <div class="stat-card">
        <h2>{{ product_count }}</h2>
        <p>Products</p>
    </div>

    <div class="stat-card">
        <h2>{{ user_count }}</h2>
        <p>Users</p>
    </div>

    <div class="stat-card">
        <h2>{{ order_count }}</h2>
        <p>Orders</p>
    </div>

</div>

    <a class="btn" href="/admin/add-product">
        Add Product
    </a>
    <a class="btn" href="/admin/products">
    Manage Products
</a>


</div>

</body>

</html>
