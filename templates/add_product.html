<!DOCTYPE html>
<html>
<head>
<title>Add Product - EVERWEAR</title>

<style>

body{
    background:#f5f5f5;
    font-family:Segoe UI;
}

.card{
    width:600px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    background:#ff6b00;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h1>Add Product</h1>

<form method="POST" enctype="multipart/form-data">


<input
type="text"
name="name"
placeholder="Product Name"
required>

<input
type="number"
name="price"
placeholder="Price"
required>

<input
type="file"
name="image"
required>

<input
type="text"
name="category"
placeholder="Category (Men, Women, Shoes)"
required>

<textarea
name="description"
placeholder="Description"
required></textarea>

<button type="submit">
Add Product
</button>

</form>

</div>

</body>
</html>
