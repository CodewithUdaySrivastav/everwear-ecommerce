<!DOCTYPE html>
<html>
<head>
<title>Edit Product</title>

<style>

body{
    background:#f5f5f5;
    font-family:Segoe UI;
}

.card{
    width:600px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    background:#ff6b00;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h1>Edit Product</h1>

<form method="POST" enctype="multipart/form-data"></form>

<input
type="text"
name="name"
value="{{ product[1] }}"
required>

<input
type="number"
name="price"
value="{{ product[2] }}"
required>

<input
type="text"
name="image"
value="{{ product[3] }}"
required>

<input
type="text"
name="category"
value="{{ product[5] }}"
required>

<textarea
name="description"
required>{{ product[4] }}</textarea>

<button type="submit">
Update Product
</button>

</form>

</div>

</body>
</html>
